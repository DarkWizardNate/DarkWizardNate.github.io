<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event results</title>
<!--
  Post-event analytics page (issue #57). Template for
  bot/scripts/event-analytics.js, which writes it as index.html with the
  public export embedded in the data block below (so the page works from
  file:// as well as GitHub Pages), next to analytics.json, board.png and
  icons/. Self-contained: no external scripts, fonts or network calls, and
  data reaches the DOM only as text nodes and attributes.

  The "Bosses & XP" sections (issue #59) render only when the export carries
  a `wom` section, merged from bot/scripts/wom-gains.js's cache.

  The pure helpers between the ANALYTICS-PAGE-LIB markers are unit-tested by
  bot/test/event-analytics-page.test.js, which also runs the whole page
  against a DOM stub for each game mode.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --surface: #ffffff; --surface2: #f0f2f6; --line: #e1e4ea;
    --fg: #161a22; --fg-dim: #5f6776; --shadow: 0 1px 2px rgba(20, 24, 34, .05), 0 2px 8px rgba(20, 24, 34, .04);
    --accent: #3467d6; --accent-bg: #e8effc; --on-accent: #ffffff;
    --gold: #c28f00; --silver: #8792a3; --bronze: #b06a33;
    --good: #1b9a54; --good-bg: #e3f5ea; --bad: #d4433f; --bad-bg: #fbe8e7;
    --warn: #c47f00; --warn-bg: #fdf1dc; --time: #3467d6; --time-bg: #e8effc;
    --snake: #d4433f; --ladder: #1b9a54; --detour: #c98400; --jump: #8a8f98;
    --pity: #8e5bd0; --roll: #3467d6; --done: #1b9a54;
    --halo: rgba(0, 0, 0, 0.55); --start-bg: #1e1b16; --start-fg: #e8d9b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111318; --surface: #1a1d24; --surface2: #23272f; --line: #2e333d;
      --fg: #e2e5eb; --fg-dim: #929aa8; --shadow: none;
      --accent: #7aa7f5; --accent-bg: #1e2b42; --on-accent: #0d1626;
      --gold: #f0c34a; --silver: #b9c1cd; --bronze: #dc9a64;
      --good: #5bd38a; --good-bg: #173326; --bad: #ff7b74; --bad-bg: #3a1d1d;
      --warn: #f2b440; --warn-bg: #3a2d14; --time: #7aa7f5; --time-bg: #1e2b42;
      --snake: #ff7b74; --ladder: #5bd38a; --detour: #f2b033; --jump: #a3a9b6;
      --pity: #b48cf0; --roll: #7aa7f5; --done: #5bd38a;
    }
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header, main, footer { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 22px; }
  .titlebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; margin: 28px 0 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
  .dim { color: var(--fg-dim); }
  a { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-dim); font-size: 12px; white-space: nowrap; }
  /* view picker: a custom menu, since macOS pops a native <select> up over the page */
  .picker { position: relative; max-width: 100%; }
  .picker > button {
    font: inherit; color: var(--fg); background: var(--surface); cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 8px; max-width: 100%; min-width: 220px;
  }
  .picker > button .cur { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker > button .caret { color: var(--fg-dim); font-size: 11px; }
  .picker button:focus-visible, .menu a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(320px, calc(100vw - 32px));
    max-height: min(70vh, 520px); overflow-y: auto; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
  }
  .menu[hidden] { display: none; }
  .menu a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  .menu a:hover { background: var(--surface2); }
  .menu a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .menu .rank { width: 1.6em; text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; flex: none; }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 2px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }

  /* key numbers */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); margin-top: 16px; padding: 0; }
  .kpi { position: relative; padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
  .kpi .k { display: flex; align-items: center; gap: 6px; }
  .help {
    display: inline-grid; place-items: center; width: 16px; height: 16px; padding: 0; flex: none; cursor: pointer;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface2); color: var(--fg-dim);
    font: 700 10px/1 system-ui, sans-serif;
  }
  .help:hover, .help[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .help:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tip {
    position: absolute; z-index: 15; top: calc(100% - 4px); left: 8px; width: min(270px, calc(100vw - 48px));
    padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18); font-size: 12.5px; line-height: 1.45; color: var(--fg); font-weight: 400;
  }
  .tip[hidden] { display: none; }
  .kpi:nth-last-child(-n+2) .tip { left: auto; right: 8px; }
  @media (max-width: 599px) {
    /* phones: the tip spans the stats block under it instead of one cell */
    .kpis { position: relative; }
    .kpi { position: static; }
    .kpi .tip, .kpi:nth-last-child(-n+2) .tip { left: 8px; right: 8px; width: auto; }
  }
  .kpi:first-child { border-left: none; }
  .kpi .k { font-size: 12px; color: var(--fg-dim); }
  .kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
  .kpi .v.sm { font-size: 16px; }

  /* team identity */
  .icon { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; background: var(--surface2); }
  .icon.s { width: 22px; height: 22px; }
  .icon.l { width: 56px; height: 56px; }
  .icon.xl { width: 72px; height: 72px; }
  .ring-1 { box-shadow: 0 0 0 3px var(--gold); } .ring-2 { box-shadow: 0 0 0 3px var(--silver); } .ring-3 { box-shadow: 0 0 0 3px var(--bronze); }
  .teamline { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .teamline .name { font-weight: 600; overflow-wrap: anywhere; }
  .teamline a.name { color: inherit; text-decoration: none; }
  .teamline a.name:hover { text-decoration: underline; }
  .medal { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
  .medal-1 { background: var(--gold); } .medal-2 { background: var(--silver); } .medal-3 { background: var(--bronze); }
  .place { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .place-1 { color: var(--gold); } .place-2 { color: var(--silver); } .place-3 { color: var(--bronze); }

  /* podium */
  .podium .card { position: relative; overflow: hidden; padding-top: 18px; text-decoration: none; color: inherit; display: block; }
  .podium .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--line); }
  .podium .p-1::before { background: var(--gold); } .podium .p-2::before { background: var(--silver); } .podium .p-3::before { background: var(--bronze); }
  .podium .card:hover { border-color: var(--accent); }
  .podium .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
  .podium .name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.25; }
  .podium .headline { margin: 14px 0 10px; font-size: 18px; font-weight: 650; }
  .rows { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .rows li { display: flex; justify-content: space-between; gap: 12px; }
  .rows li span:last-child { font-variant-numeric: tabular-nums; text-align: right; font-weight: 550; }

  /* highlights */
  .hl-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .hl { --c: var(--accent); --cbg: var(--accent-bg); display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--c); }
  .hl .label { position: relative; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
  .hl .glyph { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--cbg); color: var(--c); font-size: 13px; }
  .hl .value { font-size: 24px; font-weight: 750; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .hl .entry { display: grid; gap: 4px; }
  .hl .entry + .entry { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
  .hl .label .tip { top: calc(100% + 6px); left: 0; right: 0; width: auto; text-transform: none; letter-spacing: 0; }
  .hl .tie { margin-left: auto; padding: 0 7px; border-radius: 999px; background: var(--cbg); color: var(--c); font-size: 11px; letter-spacing: .02em; }
  .hl .who-player { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .hl .for { font-size: 12.5px; gap: 6px; margin-top: 2px; }
  .hl .for .name { font-weight: 500; }
  .icon.s + .name { min-width: 0; }
  .hl .detail { font-size: 12.5px; color: var(--fg-dim); overflow-wrap: anywhere; }
  .c-good { --c: var(--good); --cbg: var(--good-bg); } .c-bad { --c: var(--bad); --cbg: var(--bad-bg); }
  .c-warn { --c: var(--warn); --cbg: var(--warn-bg); } .c-time { --c: var(--time); --cbg: var(--time-bg); }

  /* tables */
  .scroll { overflow-x: auto; max-width: 100%; }
  .card.flush { padding: 0; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--fg-dim); font-weight: 600; background: var(--surface2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }
  td.num, th.num { text-align: right; }
  td.wrap { white-space: normal; min-width: 150px; }
  td.rank { width: 1%; }
  @media (max-width: 599px) { .wide-only { display: none; } th, td { padding: 8px 9px; } }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .meter { position: relative; height: 8px; border-radius: 999px; background: var(--surface2); min-width: 70px; overflow: hidden; }
  .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
  .meter.fin > span { background: var(--gold); }
  .progress { display: grid; grid-template-columns: minmax(70px, 1fr) auto; gap: 10px; align-items: center; min-width: 170px; }
  /* fixed columns so every row's bar starts at the same x */
  .timecell { display: grid; grid-template-columns: 60px 4.6em; gap: 10px; align-items: center; justify-content: end; }
  .timecell > span { text-align: right; }
  .timecell .meter { min-width: 60px; height: 6px; }
  .timecell .meter > span { background: var(--time); }
  .tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 650; vertical-align: 1px; }
  .tag.fast { background: var(--good-bg); color: var(--good); }
  .tag.slow { background: var(--warn-bg); color: var(--warn); }
  .tag.open { background: var(--accent-bg); color: var(--accent); }
  .tag.skip { background: var(--surface2); color: var(--fg-dim); }

  /* team view */
  .teamhead { margin-top: 18px; padding: 0; }
  .teamhead .top { display: flex; gap: 16px; align-items: center; padding: 16px; flex-wrap: wrap; }
  .teamhead .top > div { min-width: 0; flex: 1; }
  .teamhead .name { font-size: 22px; font-weight: 750; overflow-wrap: anywhere; line-height: 1.2; }
  .teamhead .kpis { margin-top: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; background: transparent; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; }
  .nav a { text-decoration: none; overflow-wrap: anywhere; }
  .nav a:hover { text-decoration: underline; }
  .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 900px) {
    .split { grid-template-columns: minmax(0, 500px) minmax(0, 1fr); }
    .split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  .split > * { min-width: 0; }

  .board { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--start-bg); }
  .board .halo { stroke: var(--halo); fill: none; stroke-linecap: round; }
  .board .seg { fill: none; stroke-linecap: round; }
  .seg-snake { stroke: var(--snake); }
  .seg-ladder { stroke: var(--ladder); }
  .seg-setback, .seg-return { stroke: var(--detour); }
  .seg-jump { stroke: var(--jump); }
  .board .step circle { fill: #ffffff; }
  .board .step text { fill: #111111; font-family: system-ui, sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .board .done rect { fill: rgba(44, 154, 70, 0.28); stroke: var(--done); }
  .board .done text { fill: #ffffff; font-family: system-ui, sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: rgba(0,0,0,.6); }
  .board .start-label { fill: var(--start-fg); font-family: Arial, sans-serif; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--fg-dim); font-size: 12px; }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend svg { width: 28px; height: 10px; flex: none; }

  .hist { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
  .hist .bar { fill: var(--roll); }
  .hist .bar-pity { fill: var(--pity); }
  .hist .expect { stroke: var(--fg-dim); stroke-dasharray: 4 3; }
  .hist text { fill: var(--fg); font-size: 11px; text-anchor: middle; font-family: system-ui, sans-serif; }
  .hist text.dim { fill: var(--fg-dim); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 28px 0 10px; }
  .section-head h2 { margin: 0; }
  .switch { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .switch-label { padding: 0 8px 0 10px; font-size: 12px; color: var(--fg-dim); }
  .switch button { font: 600 13px/1 system-ui, sans-serif; border: 0; cursor: pointer; padding: 8px 16px; border-radius: 999px; background: transparent; color: var(--fg-dim); }
  .switch button:hover { color: var(--fg); }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .heat rect.cell { stroke: none; }
  table.acc tr.acc-row { cursor: pointer; }
  .acc-btn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .acc-btn .caret { display: inline-block; width: 12px; color: var(--fg-dim); font-size: 15px; line-height: 1; transition: transform .15s; }
  .acc-btn[aria-expanded="true"] .caret { transform: rotate(90deg); color: var(--accent); }
  .acc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  tr.acc-detail[hidden] { display: none; }
  tr.acc-detail > td { background: var(--surface2); padding: 6px 12px 8px 34px; white-space: normal; }
  tbody tr.acc-detail:hover td { background: var(--surface2); }
  .acc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .acc-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 3px 0; }
  .acc-list.names li { grid-template-columns: minmax(0, 1fr); }
  .acc-list .teamline .name { font-weight: 500; }
  .acc-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 2px 0 6px; color: var(--fg-dim); font-size: 13px; }
  .acc-stats b { color: var(--fg); font-weight: 650; font-variant-numeric: tabular-nums; }
  .acc-stats .tag { margin-left: 0; }
  .acc-detail p { margin: 2px 0; }
  .acc-list.bosses { display: block; columns: 260px 3; column-gap: 32px; }
  .acc-list.bosses li { break-inside: avoid; }
  .timecell.kc { grid-template-columns: 70px 3.6em; }
  .timecell.kc .meter > span { background: var(--bad); }
  .acc-list li.pick > span:first-child { font-weight: 650; color: var(--accent); }
  span.acc-btn { cursor: default; }
  .heat text { fill: #ffffff; font-family: system-ui, sans-serif; font-weight: 750; text-anchor: end; dominant-baseline: central; paint-order: stroke; stroke: rgba(0, 0, 0, .7); }
  .heatscale { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--fg-dim); }
  .heatscale .ramp { flex: 1; max-width: 200px; height: 8px; border-radius: 999px; background: linear-gradient(90deg, hsla(45, 95%, 55%, .25), hsla(25, 95%, 52%, .6), hsla(0, 90%, 50%, .9)); }
  .luck-total { font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .note { font-size: 12.5px; color: var(--fg-dim); margin: 10px 0 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .pills li { padding: 3px 10px; border-radius: 999px; background: var(--good-bg); color: var(--good); font-weight: 600; font-size: 13px; }

  /* bosses & xp */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .section-head h3 { margin: 0; }
  .boss-pick {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; box-shadow: var(--shadow); max-width: 100%; cursor: pointer;
  }
  .boss-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player-search { cursor: text; width: 11em; }
  .wom-caveat { position: relative; margin: 0 0 10px; font-size: 13px; color: var(--fg-dim); }
  .why-link { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .why-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .wom-caveat .tip { top: calc(100% + 6px); left: 0; width: min(480px, calc(100vw - 48px)); }
  .wom-caveat .tip p { margin: 0 0 6px; }
  .wom-caveat .tip p:last-child { margin-bottom: 0; }
  .player-search::placeholder { color: var(--fg-dim); }
  .tag.approx { background: var(--warn-bg); color: var(--warn); }
  .tag.first { margin-left: 0; }
  .sub { font-size: 12px; font-weight: 500; color: var(--fg-dim); white-space: normal; }
  button.more {
    display: block; margin: 10px auto 0; font: 600 13px/1 system-ui, sans-serif; cursor: pointer; padding: 8px 16px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); box-shadow: var(--shadow);
  }
  button.more:hover { border-color: var(--accent); }
  button.more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 32px; padding-top: 14px; padding-bottom: 28px; color: var(--fg-dim); border-top: 1px solid var(--line); font-size: 13px; }
  .empty { padding: 40px 0; color: var(--fg-dim); }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <div>
      <h1 id="title">Event results</h1>

<script>
"use strict";
// >>> ANALYTICS-PAGE-LIB-BEGIN
// Same strip as util/render.js START_STRIP_HEIGHT / START_LABEL_WIDTH.
const START_H = 96;
const START_LABEL_W = 150;

function ordinal(n) {
  const mod100 = n % 100;
  const suffix = mod100 >= 11 && mod100 <= 13 ? "th" : { 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th";
  return `${n}${suffix}`;
}

function formatDuration(ms) {
  if (ms == null) return "–";
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "<1m";
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const rest = mins % 60;
  if (days) return `${days}d ${hours}h`;
  if (hours) return `${hours}h ${rest}m`;
  return `${rest}m`;
}

function formatAverage(avg) {
  return avg == null ? "–" : avg.toFixed(2);
}

function formatDelta(delta) {
  if (delta == null) return "–";
  const text = Math.abs(delta).toFixed(2);
  return delta < 0 ? `−${text}` : `+${text}`;
}

function formatTiles(n) {
  /** A signed tile count: "+16.5", "−15", "0". */
  if (n == null) return "–";
  const r = Math.round(n * 10) / 10;
  if (r === 0) return "0";
  const text = Number.isInteger(r) ? String(Math.abs(r)) : Math.abs(r).toFixed(1);
  return r < 0 ? `−${text}` : `+${text}`;
}

function tileCenter(bounds) {
  // The same anchor render.js uses for icons: the middle of the tile's bounds.
  return { x: bounds.x + bounds.w / 2, y: bounds.y + bounds.h / 2 };
}

function pointFor(board, index) {
  /** Where position `index` sits on the overlay; 0 is the start strip below the image. */
  if (index === 0) return { x: Math.min(START_LABEL_W + START_H / 2, board.width / 2), y: board.height + START_H / 2 };
  const tile = board.tiles.find((t) => t.index === index);
  return tile && tile.bounds ? tileCenter(tile.bounds) : null;
}

function stepColor(fraction) {
  /** Path gradient from early (blue) to late (magenta). */
  const f = Math.min(1, Math.max(0, fraction || 0));
  return `hsl(${Math.round(205 + f * 115)}, 80%, 52%)`;
}

function histogramBars(histogram, pityHistogram, height) {
  /** Bar heights scaled so the tallest face fills `height`. */
  const max = Math.max(1, ...histogram);
  return histogram.map((count, i) => {
    const pity = (pityHistogram && pityHistogram[i]) || 0;
    return { face: i + 1, count, pity, total: (count / max) * height, pityHeight: (pity / max) * height };
  });
}

function zoneName(tz, at) {
  /** "ET" where the zone has a short generic name, else its short name ("BST", "GMT+1"); as the export's snapshot label. */
  const pick = (style) => new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: style }).formatToParts(at).find((p) => p.type === "timeZoneName")?.value ?? "";
  const generic = pick("shortGeneric");
  return /\s/.test(generic) || !generic ? pick("short") : generic;
}

function compactDuration(ms) {
  /** A short duration for a board tile: "45m", "16h", "4.5d". */
  if (!ms || ms < 60000) return "<1m";
  const mins = ms / 60000;

  const get = typeof value === "function" ? value : (row) => row[value];

      { label: "Team with the most KC", glyph: "⚑", color: "c-time", entries: wom.teams.filter((t) => t.ranks.totalKc === 1 && t.totals.totalKc > 0 && teamByKey.has(t.team)),

  }

  function womLeaderboard() {
    /**
     * A metric switch and a boss picker; a picked boss ranks on its KC until "All bosses" or a metric
     * is chosen. Players without WOM data follow the ranked ones, unranked. A search shows every
     * matching player with their rank over everyone.
     */
    let metric = "totalKc";
    let boss = "";
    let expanded = false;
    let query = "";
    const search = h("input", { type: "search", class: "boss-pick player-search", placeholder: "Find a player", "aria-label": "Find a player" });
    search.addEventListener("input", () => { query = search.value.trim().toLowerCase(); draw(); });
    const picker = h("select", { class: "boss-pick", "aria-label": "Rank by boss" },
      h("option", { value: "" }, "All bosses"),
      wom.bosses.map((b) => h("option", { value: b.metric }, b.name)));
    picker.addEventListener("change", () => { boss = picker.value; draw(); });
    const buttons = Object.entries(WOM_METRICS).map(([key, m]) => {
      const b = h("button", { type: "button", "aria-pressed": "false" }, m.label);
      b.addEventListener("click", () => { metric = key; boss = ""; picker.value = ""; draw(); });
      return [key, b];
    });
    const body = h("div");

    function draw() {
      for (const [key, b] of buttons) b.setAttribute("aria-pressed", String(!boss && key === metric));
      const pick = boss ? wom.bosses.find((b) => b.metric === boss) : null;
      const ranked = pick
        ? rankRows(womPlayers, (m) => (m.bosses.find((b) => b.metric === boss) || {}).kc ?? null)
        : rankRows(womPlayers, metric);
      const format = pick ? count : WOM_METRICS[metric].format;
      const all = [
        ...ranked.map((r) => ({
          name: r.row.name,
          cells: [medal(r.rank), [r.row.name, approxTag(r.row)], teamLine(r.row.team), format(r.value)],
          label: `${r.row.name}'s bosses and XP`,
          detail: playerDetail(r.row, boss),
        })),
        ...womUntracked.map((m) => ({
          name: m.name,
          cells: [h("span", { class: "dim" }, "–"), [m.name, noDataTag()], teamLine(m.team), "–"],
          label: `Why ${m.name} has no Wise Old Man data`,
          detail: untrackedDetail(m),
        })),
      ];
      const matches = query ? all.filter((x) => x.name.toLowerCase().includes(query)) : all;
      const shown = query || expanded ? matches : matches.slice(0, 10);
      const more = h("button", { type: "button", class: "more" }, `Show all ${matches.length}`);
      more.addEventListener("click", () => { expanded = true; draw(); });
      body.replaceChildren(...[
        shown.length
          ? accTable(["#", "Player", "Team", pick ? `${pick.name} KC` : WOM_METRICS[metric].label], shown, { at: 1, numeric: [3], rank: 0 })
          : h("p", { class: "dim" }, query ? `No player matches “${search.value.trim()}”.` : "No tracked player gained anything here."),
        matches.length > shown.length ? more : null,
      ].filter(Boolean));
    }
    draw();
    return [
      h("div", { class: "section-head" }, h("h3", null, "Leaderboard"),
        h("div", { class: "controls" },
          h("div", { class: "switch", role: "group", "aria-label": "Leaderboard ranks by" }, buttons.map(([, b]) => b)),
          picker, search)),
      womCaveat(),
      body,
    ];
  }

  function tally() {
    /**
     * Per tile: the teams that stopped on it, each once, with its time there: the same tile time as
     * its team page (first stop to the approved proof, so a trip back to redo it isn't a second
     * stay). A ladder top or snake tail counts; a snake head, ladder foot or pity landing doesn't.
     * In bingo: the teams that completed it.
     */
    const counts = new Map();
    const add = (index, team, row) => {
      const c = counts.get(index) || { n: 0, ms: 0, byTeam: [] };
      c.n += 1;
      c.ms += (row && row.ms) || 0;
      c.byTeam.push({ team, ms: (row && row.ms) || 0, row });
      counts.set(index, c);
    };
    for (const team of data.teams) {
      if (race) for (const row of team.tileTimes || []) add(row.tileIndex, team, row);
      else for (const t of team.tilesCompleted) add(t.tileIndex, team, null);
    }
    return counts;
  }

  function heatmapSection() {
    // Race modes switch between stops and total time spent; bingo shows completions only.
    const counts = tally();
    if (![...counts.values()].some((c) => c.n)) return [];
    const MODES = {
      stops: {
        label: "Teams",
        title: "Where teams stopped",
        value: (c) => c.n,
        text: (c) => String(c.n),
        scale: (max) => ["1", String(max), "teams"],
        note: "How many teams stopped on each tile, each team once, including after a ladder or snake moved it there. A snake head, a ladder foot or a pity re-roll landing isn't a stop. Hover a tile for its numbers.",
      },
      time: {
        label: "Time spent",
        title: "Where teams spent their time",
        value: (c) => c.ms,
        text: (c) => compactDuration(c.ms),
        scale: (max) => ["less", compactDuration(max), "total time, all teams together"],
        note: "Every team's time on each tile added together. A team's time is the same as on its team page: from its first stop on the tile to the proof that was approved, or to the cutoff if it was still there. Two teams at 5 hours each make 10 hours. Hover a tile for its numbers.",
      },
      teams: {
        title: "Most completed tiles",
        value: (c) => c.n,
        text: (c) => String(c.n),
        scale: (max) => ["1", String(max), "teams"],
        note: "How many teams completed each tile by the cutoff.",
      },
    };
    let mode = race ? "stops" : "teams";
    const heading = h("h2", null);
    const body = h("div", { class: "split" });
    const buttons = race
      ? ["stops", "time"].map((key) => {
          const b = h("button", { type: "button", "aria-pressed": "false" }, MODES[key].label);
          b.addEventListener("click", () => { mode = key; draw(); });
          return [key, b];
        })
      : [];

    function draw() {
      const m = MODES[mode];
      heading.textContent = m.title;
      for (const [key, b] of buttons) b.setAttribute("aria-pressed", String(key === mode));
      const max = Math.max(0, ...[...counts.values()].map(m.value));
      const board = boardSvg((u) => data.board.tiles.filter((t) => t.bounds && counts.has(t.index) && m.value(counts.get(t.index)) > 0).map((t) => {
        const c = counts.get(t.index);
        const b = t.bounds;
        return s("g", { class: "heat" },
          s("title", null, `Tile ${t.index}${t.taskName ? ` · ${t.taskName}` : ""}: ${plural(c.n, "team")}${race ? `, ${formatDuration(c.ms)} in all` : ""}`),
          s("rect", { class: "cell", x: b.x, y: b.y, width: b.w, height: b.h, fill: heatColor(m.value(c), max) }),
          s("text", { x: b.x + b.w * 0.94, y: b.y + b.h * 0.8, "font-size": Math.min(b.w, b.h) * (mode === "time" ? 0.24 : 0.3), "stroke-width": 0.9 * u }, m.text(c)));
      }), { start: false });
      const [lo, hi, unit] = m.scale(max);
      const top = [...counts.entries()].sort((a, b) => m.value(b[1]) - m.value(a[1]) || b[1].ms - a[1].ms || a[0] - b[0]).slice(0, 8);
      const task = (index) => (tileByIndex.get(index) || {}).taskName || "";
      body.replaceChildren(
        h("div", { class: "card" }, board, h("div", { class: "heatscale" }, lo, h("span", { class: "ramp" }), hi, h("span", null, unit))),
        h("div", null, tileAccordion(top, m, task), h("p", { class: "note" }, m.note, " Click a row to see each team.")));
    }
    draw();
    return [
      h("div", { class: "section-head" }, heading,
        buttons.length ? h("div", { class: "switch", role: "group", "aria-label": "Heatmap shows" }, h("span", { class: "switch-label" }, "Show"), buttons.map(([, b]) => b)) : null),
      body,
    ];
  }

  function accTable(head, items, opts = {}) {
    /**
     * A table whose rows open a detail row: each item is { cells, detail, label }. The caret goes in
     * column `at` (default 0); an item without `detail` gets a blank caret, so its row lines up but
     * doesn't open. `numeric`, `wrap`, `rank` and `wide` (dropped on phones) are column indexes, as in
     * table().
     */
    const at = opts.at || 0;
    const numeric = opts.numeric || [];
    const cls = (i, cell) => [
      numeric.includes(i) ? "num" : cell && (opts.wrap || []).includes(i) ? "wrap" : cell && opts.rank === i ? "rank" : null,
      (opts.wide || []).includes(i) ? "wide-only" : null,
    ].filter(Boolean).join(" ") || null;
    const rows = items.flatMap((item) => {
      const caret = h("span", { class: "caret", "aria-hidden": "true" }, item.detail ? "▸" : "");
      if (!item.detail) {
        return [h("tr", null, item.cells.map((cell, i) =>
          h("td", { class: cls(i, true) }, i === at ? h("span", { class: "acc-btn" }, caret, cell) : cell)))];
      }
      const detail = h("tr", { class: "acc-detail" }, h("td", { colspan: head.length }, item.detail));
      detail.hidden = true;
      const toggle = h("button", { type: "button", class: "acc-btn", "aria-expanded": "false", "aria-label": item.label }, caret, item.cells[at]);
      const row = h("tr", { class: "acc-row" }, item.cells.map((cell, i) => h("td", { class: cls(i, true) }, i === at ? toggle : cell)));
      const flip = () => {
        detail.hidden = !detail.hidden;
        toggle.setAttribute("aria-expanded", String(!detail.hidden));
      };
      toggle.addEventListener("click", (e) => { if (e && e.stopPropagation) e.stopPropagation(); flip(); });
      row.addEventListener("click", flip);
      return [row, detail];
    });
    return h("div", { class: "card flush" }, h("div", { class: "scroll" }, h("table", { class: "acc" },
      h("thead", null, h("tr", null, head.map((c, i) => h("th", { class: cls(i, false) }, c)))),
      h("tbody", null, rows))));
  }

  function tileAccordion(top, m, task) {
    /** The heatmap's top tiles; each row opens its teams, longest first, with the team page's time bars. */
    const head = race ? ["Tile", "Task", "Teams", "Time there"] : ["Tile", "Task", "Teams"];
    return accTable(head, top.map(([index, c]) => {
      const teams = [...c.byTeam].sort((a, b) => b.ms - a.ms || a.team.rank - b.team.rank);
      const max = Math.max(0, ...teams.map((t) => t.ms));
      return {
        cells: [index, task(index), c.n, ...(race ? [formatDuration(c.ms)] : [])],
        label: `Teams on tile ${index}`,
        detail: h("ul", { class: race ? "acc-list" : "acc-list names" }, teams.map((t) => h("li", null,
          h("div", { class: "teamline" }, icon(t.team, "s"), h("a", { class: "name", href: `#${t.team.key}` }, t.team.name),
            t.row && !t.row.completed ? h("span", { class: t.row.open ? "tag open" : "tag skip" }, t.row.open ? "at cutoff" : "not done") : null),
          race ? timeCell(t.ms, max, t.row && t.row.submittedAt) : null))),
      };
    }), { numeric: race ? [0, 2, 3] : [0, 2], wrap: [1] });
  }

  function timeCell(ms, max, submittedAt) {
    // The bar and duration used by the team page's tile table and the heatmap breakdowns.
    return h("div", { class: "timecell", title: submittedAt ? `Proof submitted ${when(submittedAt)}` : null },
      h("div", { class: "meter" }, h("span", { style: `width:${percent(ms, max)}%` })),
      h("span", null, formatDuration(ms)));
  }

  // --- Team view ---

  function boardSvg(children, opts = {}) {
    // Standard mode adds the start strip (position 0) below the image, as the bot's board render does.
    const W = data.board.width;
    const H = data.board.height;
    const u = Math.max(W, H) / 200;
    const strip = standard && opts.start !== false;
    return s("svg", { class: "board", viewBox: `0 0 ${W} ${strip ? H + START_H : H}`, role: "img", "aria-label": "Board" },
      s("image", { href: data.board.image, x: 0, y: 0, width: W, height: H }),
      strip && s("rect", { x: 0, y: H, width: W, height: START_H, fill: "var(--start-bg)" }),
      strip && s("text", { class: "start-label", x: 16, y: H + START_H / 2 + 10, "font-size": 28 }, "START"),
      children(u));
  }

  const SEG_STYLE = {
    roll: { width: 2, dash: null },
    advance: { width: 2, dash: null },
    snake: { width: 1.6, dash: [3, 2] },
    ladder: { width: 1.6, dash: [3, 2] },
    setback: { width: 1.5, dash: [0.1, 2.4] },
    return: { width: 1.5, dash: [0.1, 2.4] },
    jump: { width: 0.9, dash: null },
  };

  function pathOverlay(team) {
    return boardSvg((u) => {
      const lines = [];
      const halos = [];
      const n = team.path.length;
      team.path.forEach((seg, i) => {
        const a = pointFor(data.board, seg.from);
        const b = pointFor(data.board, seg.to);
        if (!a || !b) return;
        const style = SEG_STYLE[seg.kind] || SEG_STYLE.jump;
        const coords = { x1: a.x, y1: a.y, x2: b.x, y2: b.y };
        const dash = style.dash ? style.dash.map((d) => d * u).join(" ") : null;
        halos.push(s("line", { ...coords, class: "halo", "stroke-width": (style.width + 1.2) * u, "stroke-dasharray": dash }));
        const solid = seg.kind === "roll" || seg.kind === "advance";
        lines.push(s("line", {
          ...coords,
          class: `seg seg-${seg.kind}`,
          stroke: solid ? (seg.pity ? "var(--pity)" : stepColor(n > 1 ? i / (n - 1) : 0)) : null,
          "stroke-width": style.width * u,
          "stroke-dasharray": dash,
        }));
      });
      // Step numbers at each stop, nudged apart when a tile is stopped on again.
      const seen = new Map();
      const steps = (team.visits || []).map((v, i) => {
        const p = pointFor(data.board, v.tileIndex);
        if (!p) return null;
        const k = seen.get(v.tileIndex) || 0;
        seen.set(v.tileIndex, k + 1);
        const r = 3.2 * u;
        const x = p.x + k * r * 1.6;
        return s("g", { class: "step" },
          s("title", null, `Stop ${i + 1}: tile ${v.tileIndex}, ${formatDuration(v.ms)}`),
          s("circle", { cx: x, cy: p.y, r, stroke: stepColor(team.visits.length > 1 ? i / (team.visits.length - 1) : 0), "stroke-width": 0.8 * u }),
          s("text", { x, y: p.y, "font-size": 3.4 * u }, i + 1));
      });
      return [halos, lines, steps];
    });
  }

  function legend() {
    const item = (label, attrs) => h("li", null,
      s("svg", { viewBox: "0 0 28 10", "aria-hidden": "true" }, s("line", { x1: 2, y1: 5, x2: 26, y2: 5, "stroke-width": 3, "stroke-linecap": "round", ...attrs })),
      label);
    return h("ul", { class: "legend" }, [
      item(standard ? "Roll (early → late)" : "Advance (early → late)", { stroke: stepColor(0.5) }),
      standard && item("Pity re-roll", { stroke: "var(--pity)" }),
      standard && item("Ladder", { class: "seg-ladder", "stroke-dasharray": "6 4" }),
      standard && item("Snake", { class: "seg-snake", "stroke-dasharray": "6 4" }),
      item("Sent back to redo", { class: "seg-setback", "stroke-dasharray": "0.1 6" }),
      item("Other move", { class: "seg-jump", "stroke-width": 1.5 }),
    ]);
  }

  function doneOverlay(team) {
    const done = new Set(team.tilesCompleted.map((t) => t.tileIndex));
    return boardSvg((u) => data.board.tiles.filter((t) => done.has(t.index) && t.bounds).map((t) => {
      const c = tileCenter(t.bounds);
      return s("g", { class: "done" },
        s("title", null, `Tile ${t.index} completed`),
        s("rect", { x: t.bounds.x + u, y: t.bounds.y + u, width: Math.max(0, t.bounds.w - 2 * u), height: Math.max(0, t.bounds.h - 2 * u), "stroke-width": 1.4 * u, rx: u }),
        s("text", { x: c.x, y: c.y, "font-size": Math.min(t.bounds.w, t.bounds.h) * 0.45, "stroke-width": 0.8 * u }, "✓"));
    }));
  }

  function tileTable(team) {
    const times = team.tileTimes || [];
    if (!times.length) return h("p", { class: "dim" }, "No tiles before the cutoff.");
    const max = Math.max(0, ...times.map((t) => t.ms || 0));
    const same = (a, b) => a && b && a.tileIndex === b.tileIndex && a.arrivedAt === b.arrivedAt;
    return table(["Tile", "Task", "Reached", "Time to complete"], times.map((t) => {
      const tag = !t.completed
        ? (t.open ? h("span", { class: "tag open" }, "at cutoff") : h("span", { class: "tag skip" }, "not done"))
        : same(t, team.fastestTile) ? h("span", { class: "tag fast" }, "fastest")
        : same(t, team.longestTile) ? h("span", { class: "tag slow" }, "longest") : null;
      return [
        t.tileIndex,
        [t.taskName || "", tag],
        when(t.arrivedAt),
        timeCell(t.ms, max, t.submittedAt),
      ];
    }), { numeric: [0, 3], wrap: 1, wide: [2] });
  }

  function histogramSvg(rolls) {
    const W = 300;
    const top = 18;
    const H = 110;
    const barW = 32;
    const gap = (W - 6 * barW) / 7;
    const bars = histogramBars(rolls.histogram, rolls.pityHistogram, H);
    const expectedPerFace = rolls.count / 6;
    const max = Math.max(1, ...rolls.histogram);
    const expectY = top + H - (expectedPerFace / max) * H;
    return s("svg", { class: "hist", viewBox: `0 0 ${W} ${top + H + 34}`, role: "img", "aria-label": "Roll histogram" },
      bars.map((b, i) => {
        const x = gap + i * (barW + gap);
        const y = top + H - b.total;
        return s("g", null,
          s("title", null, `${b.face}: ${plural(b.count, "roll")}${b.pity ? `, ${b.pity} pity` : ""}`),
          s("rect", { class: "bar", x, y, width: barW, height: b.total - b.pityHeight, rx: 3 }),
          b.pity ? s("rect", { class: "bar-pity", x, y, width: barW, height: b.pityHeight, rx: 3 }) : null,
          s("text", { x: x + barW / 2, y: y - 4 }, b.count),
          s("text", { x: x + barW / 2, y: top + H + 16, class: "dim" }, b.face));
      }),
      rolls.count ? s("line", { class: "expect", x1: gap / 2, x2: W - gap / 2, y1: expectY, y2: expectY }) : null,
      s("text", { x: W / 2, y: top + H + 32, class: "dim" }, rolls.count ? "face · dashed line: expected count per face" : "face"));
  }

  function rollSection(team) {
    const r = team.rolls;
    const out = [h("h2", null, "Rolls")];
    if (!r.count) return out.concat(h("p", { class: "dim" }, "No rolls before the cutoff."));
    const l = team.luck;
    out.push(h("div", { class: "split even" },
      h("div", { class: "card" },
        h("h3", null, "Dice"),
        histogramSvg(r),
        h("p", { class: "note" },
          `Average ${formatAverage(r.average)} against ${r.expected} (${formatDelta(r.average - r.expected)}) over ${plural(r.count, "roll")}.`,
          r.pityCount ? [" ", h("span", { class: "swatch", style: "background:var(--pity)" }), `${plural(r.pityCount, "pity re-roll")}, counted in the average.`] : null)),
      h("div", { class: "card" },
        h("h3", null, "Luck"),
        h("div", { class: `luck-total ${l.tiles > 0 ? "good" : l.tiles < 0 ? "bad" : ""}` }, `${formatTiles(l.tiles)} tiles`),
        h("div", { style: "height:10px" }),
        rows([
          ["Dice vs 3.5 a roll", signed(l.dice, formatTiles(l.dice))],
          ["Ladders climbed", signed(l.ladders, `${formatTiles(l.ladders)} (${team.laddersHit})`)],
          ["Snakes slid", signed(-l.snakes, `${formatTiles(-l.snakes)} (${team.snakesHit})`)],
        ]),
        h("p", { class: "note" }, "Tiles gained or lost to chance: dice above or below average, plus ladders, minus snakes."))));
    out.push(h("h2", null, "By roller"));
    out.push(table(["Roller", "Rolls", "Average", "vs 3.5", "Pity"], [...team.rollers].sort((a, b) => b.count - a.count).map((m) => [
      m.name, m.count, formatAverage(m.average), signed(m.average - m.expected, formatDelta(m.average - m.expected)), m.pityCount,
    ]), { numeric: [1, 2, 3, 4] }));
    return out;
  }

  function teamView(team) {
    const out = [];
    const i = data.teams.indexOf(team);
    const prev = data.teams[i - 1];
    const next = data.teams[i + 1];
    out.push(h("div", { class: "nav" },
      prev ? h("a", { href: `#${prev.key}` }, `← ${prev.rank}. ${prev.name}`) : h("a", { href: "#" }, "← Overview"),
      next ? h("a", { href: `#${next.key}` }, `${next.rank}. ${next.name} →`) : h("span")));
    out.push(h("div", { class: "card teamhead" },
      h("div", { class: "top" }, icon(team, "xl"),
        h("div", null,
          h("div", { class: `place${team.rank <= 3 ? ` place-${team.rank}` : " dim"}` }, `${ordinal(team.rank)} of ${data.teams.length}`),
          h("div", { class: "name" }, team.name),
          h("div", { class: "dim" }, race ? (team.finished ? `Finished ${when(team.finishedAt)}` : `On tile ${team.position} at the cutoff`) : `${team.score.score} points`))),
      kpis(teamStats(team).concat(
        standard && team.snakesHit != null ? [["Snakes / ladders", `${team.snakesHit} / ${team.laddersHit}`, { help: HELP.links }]] : [],
        team.longestTile ? [["Longest tile", `${formatDuration(team.longestTile.ms)} · tile ${team.longestTile.tileIndex}`, { small: true, help: HELP.longest }]] : []))));

    const board = hasBoard
      ? h("div", { class: "card" }, h("h3", null, race ? "Path" : "Board"), race ? pathOverlay(team) : doneOverlay(team), race ? legend() : null)
      : null;

    if (race) {
      out.push(h("h2", null, "Tiles"));
      out.push(h("div", { class: board ? "split" : null }, board, h("div", null,
        tileTable(team),
        h("p", { class: "note" }, "Time to complete runs from the first time the team stopped on the tile to the proof that was approved, so a denied submission or a trip back to redo it is included. Tiles passed by a slide or a pity re-roll aren't counted."))));
    } else {
      out.push(h("h2", null, "Tiles completed"));
      const list = team.tilesCompleted.length
        ? table(["Tile", "Task", "Points", "Completed"], team.tilesCompleted.map((t) => [
            t.tileIndex, t.taskName || "", (tileByIndex.get(t.tileIndex) || {}).points ?? "", when(t.completedAt),
          ]), { numeric: [0, 2], wrap: 1 })
        : h("p", { class: "dim" }, "None before the cutoff.");
      const bonuses = team.score.completedBonuses;
      out.push(h("div", { class: board ? "split" : null }, board, h("div", null,
        list,
        h("h2", null, "Bonuses"),
        bonuses.length
          ? h("ul", { class: "pills" }, bonuses.map((name) => {
              const bonus = (data.board.bonuses || []).find((b) => b.name === name);
              return h("li", null, bonus ? `${name} (+${bonus.points})` : name);
            }))
          : h("p", { class: "dim" }, "None completed."))));
    }

    out.push(womTeamSection(team));
    if (standard && team.rolls) out.push(rollSection(team));
    return out;
  }

  return { overview, teamView, teamByKey, icon };
}

function start() {
  const data = JSON.parse(document.getElementById("analytics-data").textContent);
  const main = document.getElementById("main");
  const picker = document.getElementById("view");
  const button = document.getElementById("view-button");
  const menu = document.getElementById("view-menu");
  const current = document.getElementById("view-current");
  if (!data) {
    main.replaceChildren(h("p", { class: "empty" }, "No data yet: this is the template. Generate the page with bot/scripts/event-analytics.js."));
    return;
  }
  const v = view(data);
  document.title = `${data.game.name}: results`;
  document.getElementById("title").textContent = data.game.name;
  append(document.getElementById("subtitle"), [
    h("span", { class: "chip" }, MODE_NAMES[data.game.mode] || data.game.mode),
    h("span", { class: "chip" }, `Final standings ${data.snapshot.label}`),
  ]);
  document.getElementById("footer").textContent =
    `Snapshot ${data.snapshot.label}. Standings and stats as of the official cutoff; activity after it isn't included.`;

  // The view menu: plain links to #<team key>; the hash drives what's shown.
  const links = [h("a", { href: "#", "data-key": "" }, h("span", { class: "rank" }), "Overview")]
    .concat(data.teams.map((t) => h("a", { href: `#${t.key}`, "data-key": t.key },
      h("span", { class: "rank" }, t.rank), v.icon(t, "s"), h("span", null, t.name))));
  append(menu, [links[0], h("div", { class: "sep" }), links.slice(1)]);
  function setOpen(open) {
    menu.hidden = !open;
    button.setAttribute("aria-expanded", String(open));
    if (open) {
      const active = links.find((a) => a.getAttribute("aria-current") === "page");
      if (active && active.focus) active.focus();
    }
  }
  button.addEventListener("click", () => setOpen(menu.hidden));
  menu.addEventListener("click", () => setOpen(false));
  menu.addEventListener("keydown", (e) => {
    const i = links.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const next = links[(i + (e.key === "ArrowDown" ? 1 : links.length - 1)) % links.length];
      if (next && next.focus) next.focus();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu.hidden) { setOpen(false); button.focus(); }
    if (e.key === "Escape") closeTips();
  });
  document.addEventListener("click", (e) => {
    if (!menu.hidden && !picker.contains(e.target)) setOpen(false);
    closeTips();
  });

  function render() {
    const key = location.hash.slice(1);
    const team = v.teamByKey.get(key);
    for (const a of links) {
      if (a.getAttribute("data-key") === (team ? key : "")) a.setAttribute("aria-current", "page");
      else if (a.removeAttribute) a.removeAttribute("aria-current");
    }
    current.textContent = team ? `${team.rank}. ${team.name}` : "Overview";
    setOpen(false);
    openTip = null;
    main.replaceChildren(...(team ? v.teamView(team) : v.overview()).flat());
    if (window.scrollTo) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);
  render();
}

start();
</script>
</body>
</html>
